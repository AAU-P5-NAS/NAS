[project]
name = "nas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "onnx>=1.19.0",
    "matplotlib>=3.10.6",
    "pandas>=2.3.2",
    "numpy>=2.3.3",
    "pre-commit>=4.3.0",
    "pydantic>=2.11.9",
    "pytest>=8.4.2",
    "rich>=14.1.0",
    "stable-baselines3[extra]>=2.7.0",
    "gymnasium>=1.2.1",
    "torchmetrics>=1.8.2",
    "fvcore>=0.1.5.post20221221",
    "stable-baselines3[extra]>=2.7.0",
    "requests>=2.32.5",
    "gdown>=5.2.0",
    "optuna>=3.10.0",
    "pytest-cov>=7.0.0",
    "sb3-contrib>=2.7.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
