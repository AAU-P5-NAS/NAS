name: Run Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install uv and sync
        run: pip install uv | uv sync 
        
      - name: Run the tests
        run: uv run pytest
